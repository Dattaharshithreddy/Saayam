# Builds an installable Saayam APK on GitHub's servers — no Expo account or local Android SDK needed.
# Runs on every push to main, or by hand: Actions → "Build Android APK" → Run workflow.
# The APK appears as a GitHub Release (public download) and as a workflow artifact.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -Dorg.gradle.jvmargs=-Xmx4g

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="saayam-v${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: saayam-apk
          path: ${{ steps.apk.outputs.name }}

      - name: Publish as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}-build${{ github.run_number }}
          name: Saayam ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          body: |
            Test build of Saayam. Download the .apk below on an Android phone and open it to install
            (allow "Install unknown apps" for your browser or Files app when asked).
            This build is signed with a test key — for Google Play, build the .aab with `eas build --profile production`.
          files: ${{ steps.apk.outputs.name }}
